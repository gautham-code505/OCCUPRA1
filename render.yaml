services:
  - type: web
    name: occupra-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx src/prisma/seed.ts
    startCommand: npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      # Random secret generated by Render — never commit a real one
      - key: JWT_SECRET
        generateValue: true
      # Set in the Render dashboard (Environment tab); not stored in git
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Comma-separated list of allowed frontend origins, e.g. https://occupra.vercel.app
      - key: CORS_ORIGINS
        sync: false
